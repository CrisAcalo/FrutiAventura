[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Regla de redirección SPA (Single Page Application)
# Redirige cualquier ruta a index.html para evitar errores 404 al recargar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché óptima para los assets estáticos generados por Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
